[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretwards"
version = "0.1.0"
description = "Offline, LLM-free de-identification and record linkage for English/Hindi/Hinglish hospital records"
requires-python = ">=3.11"  # tomllib for config files
dependencies = ["regex==2026.11.24", "rapidfuzz==3.14.6", "openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
secretwards = "secretwards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"secretwards.detect.gazetteer" = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
